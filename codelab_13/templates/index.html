<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AI Image Editor</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', path='css/style.css') }}">
</head>
<body class="bg-light">

  <div class="container py-5">
    <h1 class="text-center mb-4">AI Image Editor</h1>

    <form method="post" action="/upload" enctype="multipart/form-data" class="text-center mb-5">
      <input type="file" name="file" accept="image/*" class="form-control mb-3 w-50 mx-auto" required>
      <button type="submit" class="btn btn-primary">Upload & Generate</button>
    </form>

    {% if original_image %}
    <div class="row text-center">
      <div class="col-md-6">
        <h5>Original Image</h5>
        <img src="{{ original_image }}" class="img-fluid rounded shadow-sm" alt="Original">
      </div>
      <div class="col-md-6">
        <h5>AI Edited Image</h5>
        <img src="{{ ai_image }}" class="img-fluid rounded shadow-sm" alt="AI Edited">
      </div>
    </div>
    {% endif %}
  </div>

</body>
</html>
